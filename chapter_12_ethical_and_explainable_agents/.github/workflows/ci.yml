name: Chapter 12 CI - Ethical and Explainable Agents

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-ethical-explainable-agents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Agent 22 (Fair Hiring Agent - Bias Mitigation & 4/5ths Rule)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python 22_ethical_fair_hiring_agent/main.py

      - name: Run Agent 23 (Explainable Diagnostic Agent - SHAP & Calibrated Uncertainty)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python 23_explainable_diagnostic_agent/main.py
